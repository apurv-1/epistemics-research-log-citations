[[steps]]
id = "s1"
tool = "python"
input = '''
import flask
from flask import request, jsonify

app = flask.Flask(__name__)

def power_tower_last_digit(numbers):
    if not numbers:
        return 1
    result = 1
    for num in reversed(numbers):
        result = pow(num, result, 10)
    return result

@app.route('/exp_last_digit', methods=['POST'])
def exp_last_digit():
    data = request.get_json()
    if not isinstance(data, list) or not all(isinstance(x, int) and 0 <= x <= 9 for x in data):
        return jsonify({"error": "Invalid input"}), 400
    result = power_tower_last_digit(data)
    return jsonify({"result": result})

if __name__ == '__main__':
    app.run(host='0.0.0.0', port=5000)

with open('server.py', 'w') as f:
    f.write(inspect.getsource(power_tower_last_digit))
    f.write('\n')
    f.write(inspect.getsource(exp_last_digit))
    f.write('\n')
    f.write("app = flask.Flask(__name__)\n")
    f.write("if __name__ == '__main__':\n")
    f.write("    app.run(host='0.0.0.0', port=5000)\n")

print("Server script created successfully.")
'''
