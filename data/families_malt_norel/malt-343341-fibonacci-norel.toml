output = '''
input number = x
x + 5 = x
x output
'''

[[steps]]
id = "s3"
tool = "bash"
input = "cat programs/factorial"
output = '''
input number = a
1 = b
{
  a * b = b
  a - 1 = a
}
{ a > 0 }
while

b output
'''

[[steps]]
id = "s4"
tool = "bash"
input = "cat programs/collatz"
output = '''
0 = steps
input number = n
{
  { n / 2 = n }
  { n * 3 + 1 = n }
  (n % 2 == 0)
  if
  steps + 1 = steps
}
{ n != 1 }
while
steps output
'''

[[steps]]
id = "s5"
tool = "bash"
input = "./interpreter programs/add_five 10"
output = "15"

[[steps]]
id = "s6"
tool = "bash"
input = "./interpreter programs/factorial 5"
output = "120"

[[steps]]
id = "s7"
tool = "bash"
input = '''
cat > /home/agent/fibonacci.prog << 'EOF'
input number = n
0 = a
1 = b
0 = i

{
  0 output
}
{
  {
    1 output
  }
  {
    2 = i
    {
      a + b = temp
      b = a
      temp = b
      i + 1 = i
    }
    { i <= n }
    while
    b output
  }
  (n == 1)
  if
}
(n == 0)
if
EOF
'''
output = ""

[[steps]]
id = "s14"
critical = true
tool = "bash"
input = "./interpreter /home/agent/fibonacci.prog 6"
output = "8"

