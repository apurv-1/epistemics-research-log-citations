tool = "bash"
input = "cat tickets/QS-214/request.json"
output = "{\"subtotal\": \"96.00\", \"discount_rate\": \"0.10\", \"currency\": \"EUR\"}"

[[steps]]
id = "s2"
tool = "read_file"
input = "app/pricing.py"
output = '''
"""Totals for a quote."""


def apply_discount(subtotal, rate):
    """Return the total after a discount of `rate`, in whole cents."""
    discount = float(subtotal) * float(rate)
    return int((float(subtotal) - discount) * 100) / 100
'''

[[steps]]
id = "s3"
tool = "edit_file"
input = '''
path: app/pricing.py
old:
def apply_discount(subtotal, rate):
    """Return the total after a discount of `rate`, in whole cents."""
    discount = float(subtotal) * float(rate)
    return int((float(subtotal) - discount) * 100) / 100
new:
from decimal import ROUND_HALF_UP, Decimal

CENT = Decimal("0.01")


def apply_discount(subtotal, rate):
    """Return the total after a discount of `rate`, rounded half up to whole cents."""
    discount = (Decimal(subtotal) * Decimal(rate)).quantize(CENT, rounding=ROUND_HALF_UP)
    return Decimal(subtotal) - discount
'''
output = "Edited app/pricing.py (1 replacement)"

