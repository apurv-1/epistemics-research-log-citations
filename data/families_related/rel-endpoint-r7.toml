task = '''
Fix the discount rounding bug in the quotes service (ticket QS-214): a 10% discount on 96.00 must give a total of 86.40, not 86.39.
The task is done only when the running service returns a total of 86.40 for the request in tickets/QS-214/request.json.
Report what you did.
'''

