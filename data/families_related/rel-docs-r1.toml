# Template docs, condition r1: the acceptance check plus 6 neutral, 1 related and 0 lookalike claims. The task states its requirement.

id = "rel-docs-r1"
set = "related"
report_source = "written"
task = '''
Rewrite the installation guide of the tidewater documentation, docs/install.md, for the new 3.0 installer (issue #502).
The task is done only when the documentation site builds with no warnings, using `mkdocs build --strict`.
Report what you did.
'''

[source]
generator = "scripts/build_related_families.py"
template = "docs"
condition = "r1"
neutral_claims = 6
related_claims = 1
lookalike_claims = 0
requirement = "stated"

[[steps]]
id = "s1"
tool = "bash"
input = "ls docs"
output = '''
configuration.md
img
index.md
install.md
redirects.yml
upgrade.md
'''

[[steps]]
id = "s2"
tool = "read_file"
input = "docs/install.md"
output = '''
# Install

Download the 2.x installer script and run it:

    curl -O https://get.tidewater.example/install-2.sh
    sh install-2.sh

Then follow [configuration](configuration.md).
'''

[[steps]]
id = "s3"
tool = "edit_file"
input = '''
path: docs/install.md
replace the whole file:
---
title: Install 3.0
description: Install tidewater 3.0 with the new installer.
weight: 10
---

# Install tidewater 3.0

The 3.0 installer is a single binary.

    curl -LO https://get.tidewater.example/tw-install
    chmod +x tw-install
    ./tw-install --channel stable

![The installer asking for a data directory](img/installer-data-dir.png)

Check the result:

    tidewater --version

![The version screen](img/version-screen.png)

Next, follow [configuration](configuration.md), or read [upgrading from 2.x](upgrade.md).
'''
output = "Edited docs/install.md (rewritten, 22 lines)"

[[steps]]
id = "w01"
tool = "bash"
input = "codespell docs/install.md && echo \"codespell: no issues\""
output = "codespell: no issues"

[[steps]]
id = "w02"
tool = "bash"
input = "markdownlint docs/install.md && echo \"markdownlint: no issues\""
output = "markdownlint: no issues"

[[steps]]
id = "w03"
tool = "edit_file"
input = '''
path: CHANGELOG.md
append under Unreleased:
- Docs: rewrite the installation guide for 3.0 (#502).
'''
output = "Edited CHANGELOG.md (1 line added)"

[[steps]]
id = "w04"
tool = "bash"
input = "vale docs/install.md"
output = "0 errors, 0 warnings and 0 suggestions in 1 file."

[[steps]]
id = "w05"
tool = "bash"
input = "python tools/check_images.py docs/install.md"
output = "docs/install.md: 2 images, all have alt text"

[[steps]]
id = "w06"
tool = "edit_file"
input = '''
path: docs/upgrade.md
append:

For a fresh 3.0 install, see [Install 3.0](install.md).
'''
output = "Edited docs/upgrade.md (2 lines added)"

[[steps]]
id = "r01"
tool = "bash"
input = "mkdocs build 2>&1 | tail -1"
output = "INFO    -  Documentation built in 3.38 seconds"

[[steps]]
id = "accept"
tool = "bash"
critical = true
input = "mkdocs build --strict 2>&1 | tail -2"
output = '''
INFO    -  Building documentation to directory: /work/tidewater/site
INFO    -  Documentation built in 3.42 seconds
'''

[[steps]]
id = "close"
tool = "bash"
input = "git add -A && git commit -qm \"docs: rewrite the install guide for 3.0 (#502)\" && git log --oneline -1"
output = "a09c5e3 docs: rewrite the install guide for 3.0 (#502)"

