def convert(content):
    html = content

    html = html.replace("**", "<b>", 1) 
    html = html.replace("**", "</b>", 1)

    html = html.replace("*", "<i>", 1) 
    html = html.replace("*", "</i>", 1)

    html = html.replace("## ", "<h2>") 
    html = html.replace("# ", "<h1>")
    html = html.replace("\n", "</h1>\n", 1)
    html = html.replace("\n", "</h2>\n", 1)

    return html
'''

