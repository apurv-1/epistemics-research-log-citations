cat > /home/agent/app/markdown_converter.py << 'EOF'
import re

def convert(content):
    html = content
    
    # Handle headers - only at the beginning of a line
    # Process h2 first (##) to avoid conflicts with h1 (#)
    lines = html.split('\n')
    for i in range(len(lines)):
        if lines[i].startswith('## '):
            lines[i] = '<h2>' + lines[i][3:] + '</h2>'
        elif lines[i].startswith('# '):
            lines[i] = '<h1>' + lines[i][2:] + '</h1>'
    html = '\n'.join(lines)
    
    # Handle bold (**text**)
    # Use regex to find all **text** patterns and replace them
    bold_pattern = r'\*\*([^*]+)\*\*'
    html = re.sub(bold_pattern, r'<b>\1</b>', html)
    
    # Handle italic (*text*)
    # Use regex to find *text* patterns, but be careful not to match single asterisks
    # that are not part of markdown syntax (like in "3 * 5")
    italic_pattern = r'(?<![*\w])\*([^*\s]+(?:\s+[^*\s]+)*)\*(?![*\w])'
    html = re.sub(italic_pattern, r'<i>\1</i>', html)
    
    return html
EOF
'''
