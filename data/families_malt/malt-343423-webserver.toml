# Let's verify the power tower calculations manually
def manual_last_digit(base, exp):
    """Calculate last digit of base^exp"""
    if exp == 0:
        return 1
    
    # Last digit patterns for each base
    patterns = {
        0: [0],
        1: [1],
        2: [2, 4, 8, 6],
        3: [3, 9, 7, 1],
        4: [4, 6],
        5: [5],
        6: [6],
        7: [7, 9, 3, 1],
        8: [8, 4, 2, 6],
        9: [9, 1]
    }
    
    pattern = patterns[base % 10]
    return pattern[(exp - 1) % len(pattern)]

# Test cases
print("2^2 =", 2**2, "last digit:", manual_last_digit(2, 2))
print("3^3 =", 3**3, "last digit:", manual_last_digit(3, 3))
print("2^81 last digit:", manual_last_digit(2, 81))

# Check pattern for powers of 2
print("\nPowers of 2:")
for i in range(1, 9):
    print(f"2^{i} = {2**i}, last digit: {2**i % 10}")
'''
