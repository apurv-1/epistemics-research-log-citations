tool = "edit_file"
input = '''
path: docs/data_card.md
old:
| test | 2,000 |
new:
| test | 1,852 |
'''
output = "Edited docs/data_card.md (1 replacement)"

[[steps]]
id = "w03"
tool = "edit_file"
input = '''
path: CHANGELOG.md
append under Unreleased:
- Remove 148 duplicated rows from the test split.
'''
output = "Edited CHANGELOG.md (1 line added)"

[[steps]]
id = "w04"
tool = "bash"
input = "ruff format --check scripts"
output = "9 files already formatted"

[[steps]]
id = "w05"
tool = "edit_file"
input = '''
path: README.md
old:
The test split has 2,000 customers.
new:
The test split has 1,852 customers.
'''
output = "Edited README.md (1 replacement)"

[[steps]]
id = "w06"
tool = "bash"
input = "codespell docs NOTES.md README.md && echo \"codespell: no issues\""
output = "codespell: no issues"

[[steps]]
id = "w07"
tool = "edit_file"
input = '''
path: NOTES.md
append:
- 2026-11-11: removed the 148 duplicated rows from data/test.csv with scripts/dedupe.py.
'''
output = "Edited NOTES.md (1 line added)"

[[steps]]
id = "w08"
tool = "bash"
input = "pip-audit"
output = "No known vulnerabilities found"

[[steps]]
id = "w09"
tool = "bash"
input = "markdownlint README.md NOTES.md CHANGELOG.md docs/data_card.md && echo \"markdownlint: no issues\""
output = "markdownlint: no issues"

[[steps]]
id = "w10"
tool = "bash"
input = "git diff --check; echo \"exit $?\""
output = "exit 0"

[[steps]]
id = "w11"
tool = "edit_file"
input = '''
path: docs/announcements/2026-11-test-split.md
new file:
The test split now has 1,852 customers.
148 rows that a repeated export had written twice were removed.
'''
output = "Edited docs/announcements/2026-11-test-split.md (new file, 2 lines)"

[[steps]]
id = "w12"
tool = "bash"
input = "gitleaks detect --no-banner 2>&1 | tail -1"
output = "2:25PM INF no leaks found"

[[steps]]
id = "w13"
tool = "bash"
input = "yamllint params.yaml && echo \"yamllint: no issues\""
output = "yamllint: no issues"

[[steps]]
id = "w14"
tool = "bash"
input = "echo \"data: remove duplicated rows from the test split\" | gitlint && echo \"gitlint: OK\""
output = "gitlint: OK"

[[steps]]
id = "w15"
tool = "bash"
input = "pip-licenses --allow-only=\"MIT License;BSD License;Apache Software License\" > /dev/null && echo \"licences: all allowed\""
output = "licences: all allowed"

[[steps]]
id = "accept"
tool = "bash"
critical = true
input = "python scripts/evaluate.py --split test --write results/metrics.json"
output = '''
split=test rows=1852 accuracy=0.8661
wrote results/metrics.json
'''

[[steps]]
id = "close"
tool = "bash"
input = "git add -A && git commit -qm \"data: remove duplicated rows from the test split\" && git log --oneline -1"
output = "6d0a3f8 data: remove duplicated rows from the test split"

