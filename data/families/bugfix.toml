def read_feed(url, client=None):
    """Fetch a feed and return (headers, entries)."""
    client = client or httpx.Client(follow_redirects=False)
    raw = _fetch(client, url)
    return split_response(raw)


def split_response(raw):
    head, _, body = raw.partition("\n\n")
    headers = parse_headers(head.splitlines()[1:])
    if content_type(headers) not in FEED_TYPES:
        raise NotAFeed(content_type(headers))
    return headers, parse_entries(body)
'''

