output = '''
"""Parse the header block of a feed response."""


def parse_headers(lines):
    """Return a dict of header name to value.

    `lines` is the header block, one header per item, without line endings.
    A later duplicate overwrites an earlier one.
    """
    headers = {}
    for line in lines:
        name, value = line.split(":", 1)
        headers[name.strip()] = value.strip()
    return headers


def content_type(headers):
    """The media type without its parameters, or None if the header is missing."""
    value = headers.get("Content-Type")
    if value is None:
        return None
    return value.split(";", 1)[0].strip().lower()
'''

