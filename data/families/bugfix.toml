output = '''
from feedtools.headers import content_type, parse_headers


def test_single_header():
    assert parse_headers(["Content-Type: text/xml"]) == {"Content-Type": "text/xml"}


def test_later_duplicate_wins():
    headers = parse_headers(["ETag: a", "ETag: b"])
    assert headers == {"ETag": "b"}


def test_whitespace_is_stripped():
    assert parse_headers(["  X-Cache :  HIT  "]) == {"X-Cache": "HIT"}


def test_content_type_drops_parameters():
    assert content_type({"Content-Type": "Text/XML; charset=utf-8"}) == "text/xml"


def test_content_type_missing():
    assert content_type({}) is None
'''

