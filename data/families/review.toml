"""Partial refunds: validate a request and apply it to an invoice."""

from dataclasses import dataclass
from datetime import date
from decimal import Decimal

from ledgerly.refund_policy import within_window


@dataclass(frozen=True)
class RefundRequest:
    invoice_id: str
    amount: Decimal
    reason: str
    requested_on: date


class RefundError(ValueError):
    """A refund request that cannot be accepted."""


def validate(request, paid_on):
    if request.amount <= 0:
        raise RefundError("refund amount must be positive")
    if not request.reason.strip():
        raise RefundError("a reason is required")
    if not within_window(paid_on, request.requested_on):
        raise RefundError("the refund window has closed")


def issue_refund(request, invoice, paid_on):
    """Validate a refund request, apply it, and return the invoice's total refunded amount."""
    if request.invoice_id != invoice.id:
        raise RefundError("request is for a different invoice")
    validate(request, paid_on)
    return invoice.apply_refund(request.amount)
'''

[[steps]]
id = "read-rounding"
tool = "read_file"
input = "src/ledgerly/rounding.py"
output = '''
"""Money rounding helpers."""

from decimal import Decimal


def round_cents(amount):
    """Round an amount to whole cents."""
    return Decimal(str(round(float(amount), 2)))


def split_evenly(total, parts):
    """Split a total into `parts` amounts that add up to the total."""
    share = round_cents(total / parts)
    amounts = [share] * parts
    amounts[-1] = total - share * (parts - 1)
    return amounts
'''

