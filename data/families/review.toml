"""Payments received against an invoice."""

from dataclasses import dataclass
from datetime import date
from decimal import Decimal


@dataclass(frozen=True)
class Payment:
    invoice_id: str
    amount: Decimal
    received_on: date
    method: str = "card"


def settle(invoice, payment):
    """Mark an invoice paid when a payment covers its total."""
    if payment.amount < invoice.total:
        raise ValueError("payment does not cover the invoice total")
    invoice.pay()
    return payment.received_on
'''

