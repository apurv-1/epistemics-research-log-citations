"""Rules for how much of an invoice may be refunded, and until when."""

REFUND_WINDOW_DAYS = 90


def max_refundable(invoice):
    """The amount that can still be refunded on an invoice."""
    return invoice.total - invoice.refunded


def within_window(paid_on, today):
    """Whether a refund requested today is inside the refund window."""
    return (today - paid_on).days <= REFUND_WINDOW_DAYS
'''

