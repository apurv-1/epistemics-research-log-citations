input = "tests/test_refunds.py"
output = '''
from datetime import date
from decimal import Decimal

import pytest

from ledgerly.invoices import Invoice
from ledgerly.refunds import RefundError, RefundRequest, issue_refund

PAID_ON = date(2026, 3, 2)


def paid_invoice(total="100.00"):
    invoice = Invoice("inv-1", Decimal(total))
    invoice.pay()
    return invoice


def request(amount, on=date(2026, 3, 20), reason="damaged item"):
    return RefundRequest("inv-1", Decimal(amount), reason, on)


def test_partial_refund_is_recorded():
    assert issue_refund(request("30.00"), paid_invoice(), PAID_ON) == Decimal("30.00")


def test_two_partial_refunds_add_up():
    invoice = paid_invoice()
    issue_refund(request("30.00"), invoice, PAID_ON)
    assert issue_refund(request("20.00"), invoice, PAID_ON) == Decimal("50.00")


def test_refund_after_the_window_is_rejected():
    with pytest.raises(RefundError):
        issue_refund(request("10.00", on=date(2026, 7, 1)), paid_invoice(), PAID_ON)


def test_refund_needs_a_reason():
    with pytest.raises(RefundError):
        issue_refund(request("10.00", reason=" "), paid_invoice(), PAID_ON)
'''

