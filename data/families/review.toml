"""Invoices and the refunds recorded against them."""

from dataclasses import dataclass, field
from decimal import Decimal

from ledgerly.refund_policy import max_refundable
from ledgerly.rounding import round_cents


@dataclass
class Invoice:
    id: str
    total: Decimal
    status: str = "open"  # open, paid or void
    refunded: Decimal = Decimal("0")
    events: list = field(default_factory=list)

    def pay(self):
        if self.status != "open":
            raise ValueError(f"invoice {self.id} is {self.status}")
        self.status = "paid"
        self.events.append(("paid", self.total))

    def apply_refund(self, amount):
        """Record a full or partial refund and return the total refunded so far."""
        amount = round_cents(amount)
        if amount > max_refundable(self):
            raise ValueError("refund exceeds the refundable balance")
        self.refunded += amount
        self.events.append(("refund", amount))
        return self.refunded
'''

