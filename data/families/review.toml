# Refunds

A paid invoice can be refunded in full or in part.

## Issuing a refund

    from ledgerly.refunds import RefundRequest, issue_refund

    request = RefundRequest("inv-1", Decimal("30.00"), "damaged item", date.today())
    total_refunded = issue_refund(request, invoice, paid_on)

`issue_refund` returns the total refunded on the invoice so far.

## Rules

- The amount must be positive and a reason is required.
- Refunds are accepted for 90 days after the invoice was paid.
- The refunds on an invoice can never add up to more than its total.
- Amounts are rounded to whole cents.
'''

