output = '''
import subprocess
import sys

import pandas as pd


def test_dedupe_keeps_the_first_copy(tmp_path):
    path = tmp_path / "rows.csv"
    pd.DataFrame({"customer_id": ["a", "b", "a"], "churned": [0, 1, 1]}).to_csv(path, index=False)
    subprocess.run([sys.executable, "scripts/dedupe.py", str(path)], check=True)
    rows = pd.read_csv(path)
    assert list(rows.customer_id) == ["a", "b"] and list(rows.churned) == [0, 1]
'''

