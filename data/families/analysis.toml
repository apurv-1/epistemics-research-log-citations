filler = true
tool = "read_file"
input = "scripts/dedupe.py"
output = '''
"""Remove duplicated customer rows from CSV files, in place. Keeps the first copy."""

import sys

import pandas as pd

for path in sys.argv[1:]:
    rows = pd.read_csv(path)
    clean = rows.drop_duplicates(subset="customer_id", keep="first")
    clean.to_csv(path, index=False)
    print(f"{path}: {len(rows):,} -> {len(clean):,} rows")
'''

[[steps]]
id = "read-evaluate"
filler = true
tool = "read_file"
input = "scripts/evaluate.py"
output = '''
"""Accuracy of models/gbm_v3.pkl on one split. With --write, save the result as JSON."""

import argparse
import json
import pickle

import pandas as pd

MODEL = "models/gbm_v3.pkl"

parser = argparse.ArgumentParser()
parser.add_argument("--split", choices=["train", "val", "test"], required=True)
parser.add_argument("--write", help="Path of a JSON file to save the result to.")
args = parser.parse_args()

rows = pd.read_csv(f"data/{args.split}.csv")
with open(MODEL, "rb") as f:
    model = pickle.load(f)
features = rows.drop(columns=["customer_id", "churned"])
accuracy = float((model.predict(features) == rows["churned"]).mean())
print(f"split={args.split} rows={len(rows)} accuracy={accuracy:.4f}")
if args.write:
    with open(args.write, "w") as f:
        json.dump({"split": args.split, "rows": len(rows), "accuracy": round(accuracy, 4), "model": MODEL}, f)
    print(f"wrote {args.write}")
'''

